name: CI

on:
  push:
    branches: [master, rails8]
  pull_request:

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ruby: ["2.7", "3.0", "3.1", "3.2", "3.3"]
        rails: ["5.2", "6.0", "6.1", "7.0", "7.1", "7.2", "8.0"]
        exclude:
          # Rails 5.2 & 6.0: only officially supported up to Ruby 2.7
          - ruby: "3.0"
            rails: "5.2"
          - ruby: "3.1"
            rails: "5.2"
          - ruby: "3.2"
            rails: "5.2"
          - ruby: "3.3"
            rails: "5.2"
          - ruby: "3.0"
            rails: "6.0"
          - ruby: "3.1"
            rails: "6.0"
          - ruby: "3.2"
            rails: "6.0"
          - ruby: "3.3"
            rails: "6.0"
          # Rails 6.1: not compatible with Ruby 3.2+
          - ruby: "3.2"
            rails: "6.1"
          - ruby: "3.3"
            rails: "6.1"
          # Rails 7.2+ requires Ruby 3.1+
          - ruby: "2.7"
            rails: "7.2"
          - ruby: "3.0"
            rails: "7.2"
          - ruby: "2.7"
            rails: "8.0"
          - ruby: "3.0"
            rails: "8.0"
          # Rails 8.0 requires Ruby 3.2+
          - ruby: "3.1"
            rails: "8.0"

    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/rails_${{ matrix.rails }}.gemfile

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get install -y libidn11-dev

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake test
